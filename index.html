
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="SR Infinity Super App - All your digital services in one place.">

  <title>SR Infinity Super App</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header class="header">
    <a href="#" class="brand">
      <span class="brand-icon">∞</span>
      <span>SR Infinity</span>
    </a>

    <button id="themeToggle" aria-label="Toggle theme">🌙</button>
  </header>

  <main class="container">

    <section class="hero">
      <span class="hero-label">WELCOME TO YOUR DIGITAL WORLD</span>
      <h1>Everything You Need.<br>One Super App.</h1>
      <p>All your digital services, connected in one place.</p>
    </section>

    <section class="services">
      <div class="section-heading">
        <h2>My Services</h2>
        <span>Explore your apps</span>
      </div>

      <div id="moduleGrid" class="module-grid"></div>
    </section>

    <section id="appViewer" class="app-viewer" hidden>
      <div class="viewer-header">
        <button id="backButton">← Back to Dashboard</button>
        <h2 id="viewerTitle">Service</h2>
      </div>

      <iframe
        id="serviceFrame"
        title="Service Viewer"
        loading="lazy"
        allow="fullscreen"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>

      <p id="frameFallback" hidden>
        This website cannot open inside the app.
        <a id="externalLink" href="#" target="_blank" rel="noopener">
          Open externally
        </a>
      </p>
    </section>

  </main>

  <footer class="footer">
    © 2026 SR Infinity Super App
  </footer>

  <script src="app.js"></script>
</body>
</html>
